<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Keuangan Saya</title>

        <style>
            * {
                  box-sizing: border-box;
                        margin: 0;
                              padding: 0;
                                    font-family: Arial, sans-serif;
                                        }

                                            body {
                                                  background: #f4f6f8;
                                                        color: #222;
                                                              padding: 20px;
                                                                  }

                                                                      .container {
                                                                            max-width: 700px;
                                                                                  margin: auto;
                                                                                      }

                                                                                          h1 {
                                                                                                margin-bottom: 20px;
                                                                                                      text-align: center;
                                                                                                          }

                                                                                                              .saldo {
                                                                                                                    background: #2563eb;
                                                                                                                          color: white;
                                                                                                                                padding: 25px;
                                                                                                                                      border-radius: 15px;
                                                                                                                                            margin-bottom: 20px;
                                                                                                                                                }

                                                                                                                                                    .saldo p {
                                                                                                                                                          font-size: 14px;
                                                                                                                                                                margin-bottom: 8px;
                                                                                                                                                                    }

                                                                                                                                                                        .saldo h2 {
                                                                                                                                                                              font-size: 30px;
                                                                                                                                                                                  }

                                                                                                                                                                                      .form {
                                                                                                                                                                                            background: white;
                                                                                                                                                                                                  padding: 20px;
                                                                                                                                                                                                        border-radius: 15px;
                                                                                                                                                                                                              margin-bottom: 20px;
                                                                                                                                                                                                                  }

                                                                                                                                                                                                                      input, select, button {
                                                                                                                                                                                                                            width: 100%;
                                                                                                                                                                                                                                  padding: 12px;
                                                                                                                                                                                                                                        margin-top: 10px;
                                                                                                                                                                                                                                              border-radius: 8px;
                                                                                                                                                                                                                                                    border: 1px solid #ccc;
                                                                                                                                                                                                                                                          font-size: 16px;
                                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                                  button {
                                                                                                                                                                                                                                                                        background: #2563eb;
                                                                                                                                                                                                                                                                              color: white;
                                                                                                                                                                                                                                                                                    border: none;
                                                                                                                                                                                                                                                                                          cursor: pointer;
                                                                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                                                                  button:hover {
                                                                                                                                                                                                                                                                                                        background: #1d4ed8;
                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                .transaksi {
                                                                                                                                                                                                                                                                                                                      background: white;
                                                                                                                                                                                                                                                                                                                            padding: 20px;
                                                                                                                                                                                                                                                                                                                                  border-radius: 15px;
                                                                                                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                                                                                                          .item {
                                                                                                                                                                                                                                                                                                                                                display: flex;
                                                                                                                                                                                                                                                                                                                                                      justify-content: space-between;
                                                                                                                                                                                                                                                                                                                                                            padding: 15px 0;
                                                                                                                                                                                                                                                                                                                                                                  border-bottom: 1px solid #eee;
                                                                                                                                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                                                                                                                                          .masuk {
                                                                                                                                                                                                                                                                                                                                                                                color: green;
                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                        .keluar {
                                                                                                                                                                                                                                                                                                                                                                                              color: red;
                                                                                                                                                                                                                                                                                                                                                                                                  }
                                                                                                                                                                                                                                                                                                                                                                                                    </style>
                                                                                                                                                                                                                                                                                                                                                                                                    </head>

                                                                                                                                                                                                                                                                                                                                                                                                    <body>

                                                                                                                                                                                                                                                                                                                                                                                                      <div class="container">

                                                                                                                                                                                                                                                                                                                                                                                                          <h1>💰 Keuangan Saya</h1>

                                                                                                                                                                                                                                                                                                                                                                                                              <div class="saldo">
                                                                                                                                                                                                                                                                                                                                                                                                                    <p>Saldo Saat Ini</p>
                                                                                                                                                                                                                                                                                                                                                                                                                          <h2 id="saldo">Rp 0</h2>
                                                                                                                                                                                                                                                                                                                                                                                                                              </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                  <div class="form">
                                                                                                                                                                                                                                                                                                                                                                                                                                        <h3>Tambah Transaksi</h3>

                                                                                                                                                                                                                                                                                                                                                                                                                                              <input
                                                                                                                                                                                                                                                                                                                                                                                                                                                      type="text"
                                                                                                                                                                                                                                                                                                                                                                                                                                                              id="keterangan"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                      placeholder="Keterangan"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            >

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <input
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          type="number"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  id="jumlah"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          placeholder="Jumlah"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                >

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <select id="tipe">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <option value="masuk">Pemasukan</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <option value="keluar">Pengeluaran</option>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </select>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <button onclick="tambahTransaksi()">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          Tambah Transaksi
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="transaksi">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <h3>Riwayat Transaksi</h3>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div id="daftarTransaksi">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <p style="margin-top:15px;">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      Belum ada transaksi.
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                let saldo = 0;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    function formatRupiah(angka) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          return new Intl.NumberFormat("id-ID", {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  style: "currency",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          currency: "IDR",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  maximumFractionDigits: 0
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }).format(angka);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                function tambahTransaksi() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      const keterangan =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              document.getElementById("keterangan").value;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const jumlah =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            Number(document.getElementById("jumlah").value);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  const tipe =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          document.getElementById("tipe").value;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (keterangan === "" || jumlah <= 0) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        alert("Isi keterangan dan jumlah terlebih dahulu.");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const daftar =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    document.getElementById("daftarTransaksi");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          if (daftar.innerText === "Belum ada transaksi.") {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  daftar.innerHTML = "";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              const item = document.createElement("div");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    item.className = "item";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          if (tipe === "masuk") {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  saldo += jumlah;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          item.innerHTML = `
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <span>${keterangan}</span>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <strong class="masuk">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          + ${formatRupiah(jumlah)}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </strong>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            `;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  } else {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          saldo -= jumlah;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  item.innerHTML = `
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <span>${keterangan}</span>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <strong class="keluar">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  - ${formatRupiah(jumlah)}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </strong>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    `;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                daftar.prepend(item);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      document.getElementById("saldo").innerText =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              formatRupiah(saldo);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    document.getElementById("keterangan").value = "";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          document.getElementById("jumlah").value = "";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     
</body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </html>
